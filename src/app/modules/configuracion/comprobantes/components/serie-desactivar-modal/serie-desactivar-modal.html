<app-ds-modal
  [open]="open()"
  title="Desactivar serie"
  [hasFooter]="true"
  [width]="440"
  (closed)="cerrar()"
>
  @if (serie(); as serieActual) {
    <div class="flex flex-col gap-4">
      <p class="text-ds-base text-foreground">
        La serie {{ serieActual.codigo }} dejará de estar disponible para emitir. El correlativo se
        conserva (último emitido: {{ ultimoEmitido() }}) y puede activarse nuevamente.
      </p>
      @if (toast(); as t) {
        <app-ds-alert
          [tone]="t.tone"
          [title]="t.title"
          [description]="t.description ?? null"
          [closable]="false"
        />
      }
    </div>
  }

  <span footer class="flex gap-2">
    <app-ds-button variant="secondary" [disabled]="desactivando()" (clicked)="cerrar()">
      Cancelar
    </app-ds-button>
    <app-ds-button variant="destructive" [disabled]="desactivando()" (clicked)="desactivar()">
      {{ desactivando() ? 'Desactivando…' : 'Desactivar' }}
    </app-ds-button>
  </span>
</app-ds-modal>
