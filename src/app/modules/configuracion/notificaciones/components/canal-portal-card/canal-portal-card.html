<app-ds-card title="Notificación en el portal" subtitle="Avisos dentro del Portal B para clientes">
  <div class="flex flex-col gap-4">
    <div class="flex items-start justify-between gap-4">
      <div class="flex flex-col gap-0.5">
        <span class="text-ds-base font-medium text-foreground">Canal activo</span>
        <span class="text-ds-sm text-muted-foreground"
          >Los avisos aparecen en el portal del cliente</span
        >
      </div>
      <app-ds-switch
        [checked]="activo()"
        label="Canal del portal activo"
        class="[&_.text-ds-base]:sr-only"
        (checkedChange)="activoChange.emit($event)"
      />
    </div>

    <dl class="flex flex-col gap-3 border-t border-border pt-4">
      <div class="flex items-center justify-between gap-4">
        <dt class="text-ds-sm text-muted-foreground">Destinatarios</dt>
        <dd class="text-ds-sm font-medium text-foreground">{{ destinatarios() || '—' }}</dd>
      </div>
    </dl>
  </div>
</app-ds-card>
