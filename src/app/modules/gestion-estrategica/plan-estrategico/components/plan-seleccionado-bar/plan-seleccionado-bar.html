<div
  class="flex min-h-14 items-center gap-3 border-b border-border bg-background px-(--page-padding) py-2"
>
  <span class="text-ds-sm text-muted-foreground">Plan activo:</span>

  @if (planSeleccionado.plan(); as plan) {
    <app-ds-dropdown-menu
      class="[&_[role=menu]]:w-96 [&_[role=menu]]:max-w-[calc(100vw-2rem)] [&_[role=menuitem]>span]:min-w-0 [&_[role=menuitem]>span]:truncate"
      [items]="items()"
      align="left"
    >
      <button
        trigger
        type="button"
        class="flex h-10 w-96 max-w-full items-center gap-2.5 rounded-(--radius-field) border border-border bg-card px-3 text-foreground"
      >
        <span class="h-1.5 w-1.5 shrink-0 rounded-full" [class]="clasePunto(plan)"></span>
        <span class="min-w-0 flex-1 truncate text-left font-semibold" [attr.title]="plan.nombre">{{
          plan.nombre
        }}</span>
        <span class="shrink-0 text-ds-sm text-muted-foreground"
          >{{ plan.anioInicio }}–{{ plan.anioFin }}</span
        >
        <app-ds-icon class="shrink-0 text-muted-foreground" [img]="LucideChevronDown" [size]="16" />
      </button>
    </app-ds-dropdown-menu>

    <app-ds-badge [tone]="tonoEstado(plan.estadoCodigo)" [dot]="true">
      {{ plan.estadoNombre }}
    </app-ds-badge>
  }
</div>
