<a
  [routerLink]="routerLink()"
  class="flex h-57.5 w-full cursor-pointer flex-col items-center justify-center gap-4 rounded-[20px] border border-black/5 bg-white px-6 py-6 shadow-[0_4px_10px_rgba(0,0,0,0.1)] transition-shadow hover:shadow-[0_8px_20px_rgba(0,0,0,0.12)]"
>
  <span class="flex size-25.75 shrink-0 items-center justify-center rounded-full bg-[#f5f9ff]">
    <img [src]="icon()" alt="" class="h-16 w-16 object-contain" />
  </span>

  <span class="flex flex-col items-center gap-1 text-center">
    <span class="font-['Nunito'] text-base font-bold text-[#101828]">{{ title() }}</span>
    <span class="text-sm font-medium text-[#99a1af]">{{ description() }}</span>
  </span>
</a>
