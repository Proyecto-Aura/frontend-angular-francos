<div class="font-body flex w-full flex-col gap-1.5">
  <div class="flex w-full items-center justify-between">
    <label class="text-sm font-semibold text-[#424242]">{{ label() }}</label>
    @if (forgotPasswordText()) {
    <button type="button" class="text-xs text-[#d22b2b] hover:underline" (click)="forgotPasswordClick.emit()">
      {{ forgotPasswordText() }}
    </button>
    }
  </div>

  <div class="flex h-9.5 w-full items-center gap-2 rounded-lg border border-[#bdbdbd] bg-white px-3.5 py-2.5">
    <input [type]="type() === 'password' && !passwordVisible() ? 'password' : 'text'" [placeholder]="placeholder()"
      [value]="value()" (input)="value.set($any($event.target).value)"
      class="h-full w-full text-base text-[#424242] placeholder:text-[#bdbdbd] focus:outline-none" />

    @if (type() === 'password') {
    <button type="button" class="shrink-0 text-[#9e9e9e] hover:text-[#616161]" (click)="togglePasswordVisible()">
      <svg [lucideIcon]="eye()" [size]="18"></svg>
    </button>
    }
  </div>
</div>
