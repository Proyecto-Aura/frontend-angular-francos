<div class="flex flex-col gap-2">
  @if (label()) {
    <label
      [attr.for]="htmlFor()"
      class="text-ds-base font-semibold tracking-[-0.005em] text-foreground"
    >
      {{ label() }}
      @if (required()) {
        <span class="ml-1 text-destructive">*</span>
      }
    </label>
  }
  <ng-content />
  @if (error()) {
    <p class="flex items-center gap-1.5 text-ds-sm font-medium text-destructive">
      <span
        aria-hidden="true"
        class="inline-flex h-[15px] w-[15px] shrink-0 items-center justify-center rounded-full bg-destructive text-[10px] leading-none font-bold text-white"
        >!</span
      >
      {{ error() }}
    </p>
  } @else if (hint()) {
    <p class="text-ds-sm text-muted-foreground">{{ hint() }}</p>
  }
</div>
