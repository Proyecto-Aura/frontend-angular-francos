<section class="overflow-hidden rounded-lg border border-border bg-card shadow-ds-xs">
  @if (title() || hasActions()) {
    <header class="flex items-center justify-between gap-4 border-b border-border px-5 py-4">
      <div>
        <h3 class="text-ds-lg font-medium text-card-foreground">{{ title() }}</h3>
        @if (subtitle()) {
          <p class="mt-0.5 text-ds-sm text-muted-foreground">{{ subtitle() }}</p>
        }
      </div>
      @if (hasActions()) {
        <div class="flex items-center gap-2">
          <ng-content select="[actions]" />
        </div>
      }
    </header>
  }
  <div [class.p-(--card-padding)]="padded()">
    <ng-content />
  </div>
  @if (hasFooter()) {
    <footer class="border-t border-border bg-muted px-5 py-3">
      <ng-content select="[footer]" />
    </footer>
  }
</section>
