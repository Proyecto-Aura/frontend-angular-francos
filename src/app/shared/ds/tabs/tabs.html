<div role="tablist" class="flex items-center gap-5 overflow-x-auto border-b border-border">
  @for (tab of tabs(); track tab.id) {
    <button
      role="tab"
      type="button"
      [attr.aria-selected]="tab.id === activeId()"
      (mouseenter)="hoverId.set(tab.id)"
      (mouseleave)="hoverId.set(null)"
      (click)="changed.emit(tab.id)"
      class="mb-[-1px] inline-flex cursor-pointer items-center gap-2 border-none border-b-2 bg-transparent pb-2.5 text-ds-base whitespace-nowrap transition-colors duration-[120ms] ease-linear"
      [class.border-primary]="tab.id === activeId()"
      [class.border-transparent]="tab.id !== activeId()"
      [class.text-primary]="tab.id === activeId()"
      [class.font-medium]="tab.id === activeId()"
      [class.font-normal]="tab.id !== activeId()"
      [class.text-foreground]="tab.id !== activeId() && hoverId() === tab.id"
      [class.text-muted-foreground]="tab.id !== activeId() && hoverId() !== tab.id"
    >
      @if (tab.icon) {
        <ng-container [ngComponentOutlet]="tab.icon" [ngComponentOutletInputs]="{ size: 16 }" />
      }
      {{ tab.label }}
      @if (tab.count !== undefined) {
        <span class="rounded-full border border-border bg-muted px-1.5 text-ds-sm text-muted-foreground">{{ tab.count }}</span>
      }
    </button>
  }
</div>
