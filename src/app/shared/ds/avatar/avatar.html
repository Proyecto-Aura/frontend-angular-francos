<span
  class="inline-flex shrink-0 items-center justify-center overflow-hidden rounded-full border border-[rgba(210,43,43,0.16)] bg-accent font-semibold text-accent-foreground"
  [style.width.px]="box()"
  [style.height.px]="box()"
  [class.text-ds-xs]="box() <= 28"
  [class.text-ds-sm]="box() > 28"
>
  @if (src()) {
    <img [src]="src()" [alt]="name()" class="h-full w-full object-cover" />
  } @else {
    {{ initials() }}
  }
</span>
