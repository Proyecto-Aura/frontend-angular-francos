<span
  aria-hidden="true"
  class="inline-flex shrink-0 items-center justify-center"
  [style.width.px]="size()"
  [style.height.px]="size()"
  [style.color]="color()"
>
  <ng-container
    [ngComponentOutlet]="img()"
    [ngComponentOutletInputs]="{ size: size(), strokeWidth: strokeWidth(), color: color() }"
  />
</span>
