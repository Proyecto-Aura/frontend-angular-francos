@if (open()) {
  <div
    role="dialog"
    aria-modal="true"
    (click)="onClose()"
    (keydown.escape)="onClose()"
    class="fixed inset-0 z-50 flex items-center justify-center bg-[rgba(33,33,33,0.45)] p-6"
  >
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- no es un control interactivo, solo evita que el clic adentro cierre el modal -->
    <div
      (click)="$event.stopPropagation()"
      class="flex max-h-full w-full flex-col overflow-hidden rounded-lg bg-popover text-popover-foreground shadow-ds-lg"
      [style.maxWidth.px]="width()"
      [style.maxHeight]="maxHeight() ? 'min(' + maxHeight() + 'px, 100%)' : null"
    >
      <header
        class="flex shrink-0 items-center gap-3 bg-primary px-6 py-[18px] text-primary-foreground"
      >
        @if (hasIcon()) {
          <ng-content select="[icon]" />
        }
        <div class="min-w-0 flex-1">
          <h3 class="text-ds-lg font-semibold text-primary-foreground">{{ title() }}</h3>
          @if (description()) {
            <p class="mt-0.5 text-ds-sm text-[rgba(255,255,255,0.82)]">{{ description() }}</p>
          }
        </div>
        @if (closable()) {
          <button
            type="button"
            (click)="onClose()"
            aria-label="Cerrar"
            class="cursor-pointer border-none bg-transparent p-0.5 text-[18px] leading-none text-primary-foreground opacity-90"
          >
            ✕
          </button>
        }
      </header>

      <div class="min-h-0 flex-1 overflow-y-auto p-6">
        <ng-content />
      </div>

      @if (hasFooter() || hint()) {
        <footer
          class="flex shrink-0 items-center justify-between gap-4 border-t border-border bg-card px-6 py-3.5"
        >
          <span class="text-ds-sm text-muted-foreground">{{ hint() }}</span>
          <span class="flex justify-end gap-2">
            <ng-content select="[footer]" />
          </span>
        </footer>
      }
    </div>
  </div>
}
