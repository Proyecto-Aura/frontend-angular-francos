##################
#     CONFIG     #
##################
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

##################
#     JOBS       #
##################

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name:  Instalar Node
        uses:  actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci
      
      - name: Build (produccion)
        run: npm run build
  
  lint:
    name: lint
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true # no bloqueante hasta saldar deuda con lint
    steps:
      - name: Descargar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name:  Instalar Node
        uses:  actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - name: Instalar dependencias
        run: npm ci
      
      - name: Lint
        run: npm run lint
